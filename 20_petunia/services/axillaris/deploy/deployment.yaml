apiVersion: apps/v1
kind: Deployment
metadata:
  name: axillaris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axillaris
  template:
    metadata:
      labels:
        app: axillaris
    spec:
      containers:
      - name: axillaris
        image: roskenet/axillaris:2.10.0
        env:
        - name: KEYCLOAK_ISSUER_URI
          value: https://auth.roskenet.de/realms/petunia
        - name: KEYCLOAK_SECRET
          valueFrom:
            secretKeyRef:
              name: petunia-credentials
              key: keycloak-axillaris-secret
        - name: KEYCLOAK_INTROSPECTION_URI
          value: https://auth.roskenet.de/realms/chemicals/protocol/openid-connect/token/introspect
        ports:
        - name: www
          containerPort: 8080
