apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpicola
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpicola
  template:
    metadata:
      labels:
        app: alpicola
    spec:
      containers:
      - name: alpicola
        image: roskenet/alpicola:$VERSION
        ports:
        - name: www
          containerPort: 3000 

---

apiVersion: v1
kind: Service
metadata:
  name: alpicola
spec:
  selector:
    app: alpicola
  ports:
  - protocol: TCP
    port: 3000 
    targetPort: www

