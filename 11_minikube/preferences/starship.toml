# Nerdy, pretty, and productive Starship prompt

# Use a nerd font for icons!
add_newline = true
format = """
[](bold blue)$username$hostname$directory$conda$git_branch$git_status$python$nodejs$rust$golang$docker_context$package$cmd_duration
[](bold blue)$character
"""

right_format = """
$singularity\
$kubernetes\
$time"""

[fill]
symbol = ' '

# User and host
[username]
disabled = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style) "
show_always = true

[hostname]
ssh_only = true
format = "@[$hostname](bold yellow) "

# Directory
[directory]
style = "bold cyan"
read_only = " "
# truncation_length = 3
truncate_to_repo = true
fish_style_pwd_dir_length = 1
# truncate_to_repo = false

# Conda environment
[conda]
symbol = " "
format = '\[[$symbol$environment]($style)\]'
disabled = false

[git_branch]
symbol = " "
format = '\[[$symbol$branch]($style)\]'
style = "bold purple"

[git_status]
style = "bold red"
format = '[$all_status$ahead_behind]($style)'

# Programming languages
[python]
disabled = true
symbol = " "
format = "[$symbol$version]($style) "
style = "yellow"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "green"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "red"

[golang]
symbol = " "
format = "[$symbol$version]($style) "
style = "cyan"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "blue"

[package]
disabled = true
symbol = " "
format = "[$symbol$version]($style) "
style = "208"

# Command duration
[cmd_duration]
min_time = 1000
format = "⏱ [$duration]($style) "
style = "bold yellow"

# Prompt character
[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

# Battery (if on laptop)
[battery]
full_symbol = " "
charging_symbol = " "
discharging_symbol = " "
format = "[$symbol$percentage]($style) "
style = "bold green"

# Time (optional)
[time]
disabled = false
format = "[$time]($style) "
style = "bold white"
time_format = "%R" # 24h format

# Optional: Show jobs if background jobs are running
[jobs]
symbol = " "
style = "bold blue"
format = "[$symbol$number]($style) "

# Optional: Show OS symbol
[os]
format = "[$symbol]($style) "
style = "bold blue"
disabled = false

[os.symbols]
Arch = ""
Debian = ""
Ubuntu = ""
Fedora = ""
Redhat = ""
Alpine = ""
Mint = ""
SUSE = ""
Manjaro = ""
EndeavourOS = ""
Macos = ""
Windows = ""
