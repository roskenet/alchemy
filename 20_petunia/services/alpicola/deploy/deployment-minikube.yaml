apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpicola
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpicola
  template:
    metadata:
      labels:
        app: alpicola
    spec:
      containers:
      - name: alpicola
        image: roskenet/alpicola:2.71.0
        env:
        - name: NEXT_PUBLIC_API_BASE_URL
          value: "http://petunia"
        ports:
        - name: www
          containerPort: 80
