<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #621389;
            font-size: 2em;
            margin-top: 40px;
        }
        .petunia-image {
            width: 20%;
            height: auto;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        p {
            font-size: 1.5em;
            line-height: 1.6;
            margin: 20px 0;
        }
        a {
            color: #621389;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #4e1070;
            text-decoration: underline;
        }
        footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>❦ Willkommen ❦</h1>
        
        <img src="/img/single.png" alt="Abstract Petunia" class="petunia-image">
        
        <p><em>Project Petunia</em> findest Du hier:<br />
        <a href="https://petunia.roskenet.de">https://petunia.roskenet.de</a></p>
        
        <footer>
            &copy; 2025 <a href="https://www.felix-roske.de">Felix Roske</a>
        </footer>
    </div>
</body>
</html>
