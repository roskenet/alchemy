apiVersion: apps/v1
kind: Deployment
metadata:
  name: villadiana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: villadiana
  template:
    metadata:
      labels:
        app: villadiana
    spec:
      containers:
      - name: villadiana
        image: roskenet/villadiana:1.12.0
        ports:
        - name: www
          containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: villadiana
spec:
  selector:
    app: villadiana
  ports:
  - protocol: TCP
    port: 8080
    targetPort: www

