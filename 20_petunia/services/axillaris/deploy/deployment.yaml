apiVersion: apps/v1
kind: Deployment
metadata:
  name: axillaris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axillaris
  template:
    metadata:
      labels:
        app: axillaris
    spec:
      containers:
      - name: axillaris
        image: roskenet/axillaris:2.10.0
        env:
        - name: KEYCLOAK_ISSUER_URI
          valueFrom:
            configMapKeyRef:
              name: axillaris
              key: KEYCLOAK_ISSUER_URI
        - name: KEYCLOAK_INTROSPECTION_URI
          valueFrom:
            configMapKeyRef:
              name: axillaris
              key: KEYCLOAK_INTROSPECTION_URI
        - name: KEYCLOAK_SECRET
          valueFrom:
            secretKeyRef:
              name: petunia
              key: keycloak-axillaris-secret
        ports:
        - name: www
          containerPort: 8080
